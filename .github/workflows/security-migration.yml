name: Security migration

on:
  push:
    branches:
      - portfolio-improvements-2026-08

permissions:
  contents: write

jobs:
  migrate-next:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-improvements-2026-08

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install current lockfile
        run: yarn install --frozen-lockfile

      - name: Upgrade Next.js and lint boundary
        run: |
          yarn add next@15.5.24 --exact
          yarn add --dev eslint@8.57.1 eslint-config-next@15.5.24 @next/eslint-plugin-next@15.5.24 --exact

      - name: Patch Next.js PostCSS transitive security floor
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.resolutions = {
            ...(pkg.resolutions || {}),
            'next/postcss': '8.5.23'
          };
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          yarn install

      - name: Migrate topbar link to current Next semantics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'components/Topbar/TopbarLogo.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const before = `<Link href="/" passHref>\n      <a className={styles.logoLink} href="/">\n        <Logo />\n      </a>\n    </Link>`;
          const after = `<Link href="/" className={styles.logoLink} aria-label="Knowledge base home">\n      <Logo />\n    </Link>`;
          if (!source.includes(before)) {
            throw new Error('Expected legacy topbar link markup was not found');
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - name: Regression tests
        run: yarn test

      - name: TypeScript
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Production build
        run: yarn build

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          yarn audit --groups dependencies --json > yarn-audit.json
          status=$?
          set -e
          if (( status & 24 )); then
            cat yarn-audit.json
            exit 1
          fi

      - name: Commit synchronized migration files
        shell: bash
        run: |
          if git diff --quiet -- package.json yarn.lock components/Topbar/TopbarLogo.tsx; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "Egor Denisov"
          git config user.email "designer.egor@ya.ru"
          git add package.json yarn.lock components/Topbar/TopbarLogo.tsx
          git commit -m "fix: patch Next.js security boundary"
          git push origin HEAD:portfolio-improvements-2026-08
